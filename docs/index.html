<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Security Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-shield-lock-fill me-2" style="color:#00cc66"></i>IoT Security Monitor
        </span>
        <span id="connectionStatus" class="badge bg-warning">Desconectado</span>
    </nav>

    <div class="container-fluid mt-3">
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">Total Registros Hoy</h6>
                                <h2 id="totalToday" class="mb-0">0</h2>
                            </div>
                            <i class="bi bi-people-fill stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">Autorizados</h6>
                                <h2 id="totalAuthorized" class="mb-0">0</h2>
                            </div>
                            <i class="bi bi-check-circle-fill stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card bg-danger text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">Denegados</h6>
                                <h2 id="totalDenied" class="mb-0">0</h2>
                            </div>
                            <i class="bi bi-x-circle-fill stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card bg-warning text-dark">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">Sin Casco</h6>
                                <h2 id="totalNoHelmet" class="mb-0">0</h2>
                            </div>
                            <i class="bi bi-exclamation-triangle-fill stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-graph-up me-1"></i>Accesos por Hora
                    </div>
                    <div class="card-body">
                        <canvas id="hourlyChart" height="100"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-pie-chart me-1"></i>Método de Autorización
                    </div>
                    <div class="card-body">
                        <canvas id="methodChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts & Logs Row -->
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <i class="bi bi-bell-fill me-1"></i>Alertas Activas
                    </div>
                    <div class="card-body" id="alertsList">
                        <div class="text-muted text-center py-4">No hay alertas</div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-journal-text me-1"></i>Registro de Accesos</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="refreshLogs()">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 400px;">
                            <table class="table table-hover mb-0" id="logsTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Hora</th>
                                        <th>Persona</th>
                                        <th>Tipo</th>
                                        <th>Método</th>
                                        <th>Casco</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="logsBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted py-3">Esperando datos...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Door Control -->
        <div class="row mt-4 mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-door-open me-1"></i>Control de Puerta
                    </div>
                    <div class="card-body text-center">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="door-status" id="doorStatus">
                                    <i class="bi bi-door-closed display-1 text-secondary"></i>
                                    <p class="mt-2 mb-0">Puerta <strong id="doorStateText">Cerrada</strong></p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-success btn-lg" onclick="sendCommand('open')">
                                    <i class="bi bi-unlock-fill"></i> Abrir Puerta
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-danger btn-lg" onclick="sendCommand('close')">
                                    <i class="bi bi-lock-fill"></i> Cerrar Puerta
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
